name: Temporary signing check
# Throwaway verification of the release signing path with an ephemeral key.
# Nothing is uploaded or published. This branch is deleted after the run.
on:
  push:
    branches: [tmp/signing-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npm run build && npx cap sync android
      - name: Install Android SDK packages
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          exit "${PIPESTATUS[1]}"
      - name: Unsigned release build stays unsigned
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          ls app/build/outputs/apk/release/
          test ! -e app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ./gradlew --no-daemon clean > /dev/null
      - name: Signed release build with an ephemeral key
        working-directory: android
        run: |
          pw=$(openssl rand -hex 24); echo "::add-mask::$pw"
          ks="$RUNNER_TEMP/ephemeral.p12"
          keytool -genkeypair -storetype PKCS12 -keystore "$ks" -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass "$pw" -keypass "$pw" -dname "CN=Ephemeral CI check" > /dev/null 2>&1
          expected=$(keytool -list -v -storetype PKCS12 -keystore "$ks" -storepass "$pw" -alias ci | sed -n 's/^\s*SHA256: //p' | tr -d ': ' | tr 'A-F' 'a-f')
          # same path as release.yml: base64 secret -> file in RUNNER_TEMP -> env vars
          b64=$(base64 -w0 < "$ks"); export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$b64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ANDROID_KEYSTORE_PASSWORD="$pw" ANDROID_KEY_ALIAS=ci ANDROID_KEY_PASSWORD="$pw" ./gradlew --no-daemon assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" > signer.txt
          grep -E "^Verified using|Signer #1 certificate (DN|SHA-256)" signer.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt)
          echo "expected=$expected actual=$actual"
          [ "$actual" = "$expected" ]
          "$bt/aapt2" dump badging "$apk" | head -1
          "$bt/aapt2" dump badging "$apk" | head -1 | grep -q "versionCode='10000' versionName='1.0.0'"
          "$bt/aapt2" dump permissions "$apk"
          "$bt/aapt2" dump xmltree "$apk" --file AndroidManifest.xml | grep -E "debuggable" || echo "android:debuggable not set (release)"
          rm -f "$ks" "$ANDROID_KEYSTORE_FILE"
